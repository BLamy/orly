name: 📕 New book
description: Generate one O'RLY explainer book from a repo + subsystem
title: "[book] "
labels: ["new-book"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue (as the repo owner) kicks off CI: Claude Code digests the
        repo, writes the storyboard, narrates it, makes an O'RLY cover + icons, and
        auto-merges a PR that adds the book to the shelf.
  - type: input
    id: repo
    attributes:
      label: Repo or source
      description: A GitHub URL / owner-name, or a docs URL to study.
      placeholder: https://github.com/koajs/koa
    validations:
      required: true
  - type: textarea
    id: subsystem
    attributes:
      label: What to explain
      description: The subsystem / data-flow to walk through.
      placeholder: How a request flows through the middleware onion.
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Cover title
      placeholder: Koa.js
    validations:
      required: true
  - type: input
    id: subtitle
    attributes:
      label: Subtitle (optional)
      placeholder: How a request flows through the middleware onion
  - type: input
    id: animal
    attributes:
      label: Cover animal (optional)
      description: Leave blank to let the cover step choose one.
      placeholder: a koala
  - type: input
    id: color
    attributes:
      label: Accent color (optional hex)
      placeholder: "#d6202b"
