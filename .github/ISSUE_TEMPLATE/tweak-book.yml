name: ✏️ Tweak a book
description: Ask Claude to edit or fine-tune an existing book on the shelf
title: "[tweak] "
labels: ["tweak-book"]
body:
  - type: markdown
    attributes:
      value: |
        Anyone can file this. The repo owner runs it — by opening it themselves, or by
        applying the **build** label to your issue. CI makes the change you describe to
        the chosen book and opens a **preview PR** (reviewed and merged by hand).
  - type: dropdown
    id: book
    attributes:
      label: Which book?
      description: The dropdown stays in sync with the shelf automatically.
      options:
        # BOOKS:START (auto-generated by generator/sync-issue-books.mjs — do not edit by hand)
        - "Agent Browser & the Replay Tape — agent-browser-replay-tape"
        - "Sync Engine Insights · A proposal: the React perf pattern, one layer down — sync-insights-proposal"
        - "almostnode · A full Node.js dev environment in one browser tab — almostnode"
        - "ORLY Loop · From a GitHub issue to a published video — the-orly-loop"
        - "Koa.js · How a request flows through the middleware onion — koa"
        - "Effect · The Good Parts · Advanced — effect-advanced"
        - "Effect Internals · What the elites don't want you to know — effect-internals"
        - "Effect in Prod · Production-Level Effect — effect-in-prod"
        - "Effect · The Good Parts · Intermediate — effect-good-parts-2"
        - "Effect · The Good Parts · for Beginners — effect-type"
        - "React Server Components · React for two computers — react-server-components"
        - "Agent Patterns · Manager-worker, dispatcher, map-reduce, pipeline — agent-patterns"
        - "Electric Agents · An agent is a log — electric-agents"
        - "TanStack DB · The reactive client store for your API — tanstack-db"
        - "Electric Internals · Durable Proxy, Durable State, StreamDB and StreamFS — electric-internals"
        - "Electric Streams · Durable, replayable HTTP streams — electric-streams"
        - "Prompt Caching · How LLM providers reuse your context instead of re-reading it — prompt-caching"
        - "Differential Dataflow · Incremental computation, one difference at a time — differential-dataflow"
        - "Vercel Emulate · Signed-in end-to-end tests without the login dance — vercel-emulate"
        - "The Web Crawler · System Design, Solved №3 — sds-web-crawler"
        - "The Key-Value Store · System Design, Solved №4 — key-value-store"
        - "The Social Feed · System Design, Solved №2 — social-feed"
        - "The URL Shortener · System Design, Solved №1 — url-shortener"
        - "Explained: Machine Learning · Gradient descent, backprop, attention, diffusion — explained-ml"
        - "Explained: Distributed Systems · Rings, filters, logs, and leaders — explained-distributed"
        - "Explained: Probability · Bayes, the bell curve, entropy, and the Kalman filter — explained-probability"
        - "Explained: The Math · Fourier, eigenvectors, and convolution — watched, not derived — explained-math"
        - "A Week With Replay QA · What it means for you, from Monday to ship day — replay-qa-week"
        - "Replay QA · Agents that prove their work — replay-qa"
        # BOOKS:END
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter (optional)
      description: A chapter number to scope the change to, if it only affects one.
      placeholder: "3"
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Describe the edit — reword narration, fix a label, swap the cover animal, adjust a diagram, retitle, etc.
      placeholder: |
        In chapter 2, the narration says "middleware" — make it clearer that it runs in reverse on the way out.
        Also swap the cover animal to a fox.
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Which Claude model generates this book
      options:
        - "Fable 5 — highest quality (claude-fable-5)"
        - "Opus 4.8 (claude-opus-4-8)"
    validations:
      required: true
