name: ✏️ Tweak a book
description: Ask Claude to edit or fine-tune an existing book on the shelf
title: "[tweak] "
labels: ["tweak-book"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue (as the repo owner) kicks off CI: Claude Code makes the
        change you describe to the chosen book and auto-merges a PR — so you can
        fine-tune any book just by filing a follow-up issue.
  - type: dropdown
    id: book
    attributes:
      label: Which book?
      description: The dropdown stays in sync with the shelf automatically.
      options:
        # BOOKS:START (auto-generated by generator/sync-issue-books.mjs — do not edit by hand)
        - "The Book Machine · From a GitHub issue to a published explainer — fork your own — the-book-machine"
        - "Effect Internals · What the elites don't want you to know — effect-elite"
        - "Effect in Prod · Production-Level Effect.ts — effect-production"
        - "Effect · The Good Parts · Advanced — effect-advanced"
        - "Effect · The Good Parts · Intermediate — effect-intermediate"
        - "Effect · The Good Parts · for Beginners — effect-beginner"
        - "Koa.js · How a request flows through the middleware onion — koa-onion"
        - "almostnode · A full Node.js dev environment in one browser tab — almostnode"
        # BOOKS:END
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter (optional)
      description: A chapter number to scope the change to, if it only affects one.
      placeholder: "3"
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Describe the edit — reword narration, fix a label, swap the cover animal, adjust a diagram, retitle, etc.
      placeholder: |
        In chapter 2, the narration says "middleware" — make it clearer that it runs in reverse on the way out.
        Also swap the cover animal to a fox.
    validations:
      required: true
