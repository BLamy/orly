name: ✏️ Tweak a book
description: Ask Claude to edit or fine-tune an existing book on the shelf
title: "[tweak] "
labels: ["tweak-book"]
body:
  - type: markdown
    attributes:
      value: |
        Anyone can file this. The repo owner runs it — by opening it themselves, or by
        applying the **build** label to your issue. CI makes the change you describe to
        the chosen book and opens a **preview PR** (reviewed and merged by hand).
  - type: dropdown
    id: book
    attributes:
      label: Which book?
      description: The dropdown stays in sync with the shelf automatically.
      options:
        # BOOKS:START (auto-generated by generator/sync-issue-books.mjs — do not edit by hand)
        - "The Builder–Critic Loop · A task queue that stores the future, a builder that ends with evidence, and a critic's gauntlet that alone grants verified — builder-critic-loop"
        - "Replays: Agents That Prove Their Work · A recording is evidence; a satisfied worker is a claim — replays-agents-that-prove-their-work"
        - "Prompt Caching · How the Claude SDK reuses your context instead of re-reading it — prompt-caching"
        - "Vercel Emulate · How emulate signs an end-to-end test in as a seeded user, with no real account — vercel-emulate"
        - "Agent Patterns · Manager-worker, dispatcher, map-reduce, pipeline and blackboard topologies — electric-agent-patterns"
        - "Electric Agents · The durable runtime for long-lived agents — an agent is a log — electric-agents"
        - "Differential Dataflow · How incremental data-parallel computation is built on streams of signed changes — differential-dataflow"
        - "Electric Internals · Durable Proxy, Durable State, StreamDB and StreamFS — electric-internals"
        - "Electric Sync · Sync Postgres into local clients over HTTP with Shapes — electric-sync"
        - "Electric Streams · Durable, replayable HTTP streams for agents and real-time data — electric-streams"
        - "TanStack DB · The reactive client store for your API — tanstack-db"
        - "Zero Sync · Local-first reads, your own Postgres, live queries everywhere — zero-sync"
        - "Replay.qa · Continuous QA — replay-qa"
        - "React Server Components · React for two computers — react-server-components"
        - "ORLY Loop · From a GitHub issue to a published explainer — fork your own — the-orly-loop"
        - "Effect Internals · What the elites don't want you to know — effect-elite"
        - "Effect in Prod · Production-Level Effect.ts — effect-production"
        - "Effect · The Good Parts · Advanced — effect-advanced"
        - "Effect · The Good Parts · Intermediate — effect-intermediate"
        - "Effect · The Good Parts · for Beginners — effect-beginner"
        - "Koa.js · How a request flows through the middleware onion — koa-onion"
        - "almostnode · A full Node.js dev environment in one browser tab — almostnode"
        # BOOKS:END
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter (optional)
      description: A chapter number to scope the change to, if it only affects one.
      placeholder: "3"
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Describe the edit — reword narration, fix a label, swap the cover animal, adjust a diagram, retitle, etc.
      placeholder: |
        In chapter 2, the narration says "middleware" — make it clearer that it runs in reverse on the way out.
        Also swap the cover animal to a fox.
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Which Claude model generates this book
      options:
        - "Fable 5 — highest quality (claude-fable-5)"
        - "Opus 4.8 (claude-opus-4-8)"
    validations:
      required: true
