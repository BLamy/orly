        # BOOKS:END
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter (optional)
      description: A chapter number to scope the change to, if it only affects one.
      placeholder: "3"
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Describe the edit — reword narration, fix a label, swap the cover animal, adjust a diagram, retitle, etc.
      placeholder: |
        In chapter 2, the narration says "middleware" — make it clearer that it runs in reverse on the way out.
        Also swap the cover animal to a fox.
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Which Claude model generates this book
      options:
        - "Fable 5 — highest quality (claude-fable-5)"
        - "Opus 4.8 (claude-opus-4-8)"
    validations:
      required: true
