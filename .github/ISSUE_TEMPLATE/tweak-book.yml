name: ✏️ Tweak a book
description: Ask Claude to edit or fine-tune an existing book on the shelf
title: "[tweak] "
labels: ["tweak-book"]
body:
  - type: markdown
    attributes:
      value: |
        Anyone can file this. The repo owner runs it — by opening it themselves, or by
        applying the **build** label to your issue. CI makes the change you describe to
        the chosen book and opens a **preview PR** (reviewed and merged by hand).
  - type: dropdown
    id: book
    attributes:
      label: Which book?
      description: The dropdown stays in sync with the shelf automatically.
