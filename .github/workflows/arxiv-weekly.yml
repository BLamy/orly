name: Weekly arXiv discovery (papers → tickets → one book)

# Once a week: scan arXiv for new papers from the watched reputable authors/labs
# (.github/arxiv-watch.json), extract the teachable concepts, drop anything the
# shelf already covers, rank the rest, file an issue per concept, and build ONLY
# the top-ranked one (via new-book.yml dispatch). The other issues are inert by
# construction: they are created with GITHUB_TOKEN, which never fires issue
# events, and the discovery bot is not a collaborator — so new-book.yml's gates
# ignore them until a human applies the `build` label.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write # to dispatch new-book.yml for the weekly pick

concurrency:
  group: arxiv-weekly
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch open issues for the dedupe gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "${{ github.repository }}" --state open \
            --label paper-candidate --limit 200 \
            --json number,title,body > /tmp/open-issues.json || echo '[]' > /tmp/open-issues.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Prompt: .github/prompts/arxiv-discovery.md. Opus 5.5 (effort high) research
      # session via generator/run-opus.mjs; it fetches arXiv with curl/WebFetch.
      - name: Discover + rank this week's papers with Opus 5.5
        run: >-
          node generator/run-opus.mjs --role research
          --prompt-file .github/prompts/arxiv-discovery.md
          --output .orly-work/arxiv-result.jsonl
          --provenance .orly-work/arxiv-provenance.json --max-turns 150
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: File tickets for every concept, build the top pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/arxiv-fanout.sh
