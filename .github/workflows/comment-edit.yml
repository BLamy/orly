name: Edit a book PR (@claude)

# Reply "@claude <change>" on an open book PR (as the repo owner) and this runs the
# tweak pipeline against that PR's book(s), then commits + pushes to the PR branch.
# The push triggers preview.yml (synchronize), which redeploys the preview.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch preview.yml after pushing the edit

jobs:
  edit:
    # Only @claude comments from the owner or an added collaborator, and only on a PR
    # (not a plain issue).
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Configure git identity
        run: |
          git config user.name "Brett Lamy"
          git config user.email "brett.lamy@replay.io"

      - name: Identify the book(s) in this PR
        id: slugs
        run: |
          slugs=$(git diff origin/main...HEAD --name-only \
            | grep -E '^public/generated/[^/]+/' \
            | sed -E 's|public/generated/([^/]+)/.*|\1|' | sort -u | paste -sd ',' -)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes || true

      - name: Prepare authoring workspace and Blender
        run: |
          mkdir -p .orly-work
          sudo apt-get update -qq
          sudo apt-get install -y blender

      # The comment body and slugs reach the planner only as files written from env —
      # never interpolated into a prompt or a shell command.
      - name: Write the edit request to files
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          SLUGS: ${{ steps.slugs.outputs.slugs }}
        run: |
          printf '%s\n' "$COMMENT_BODY" > .orly-work/edit-request.md
          printf '%s\n' "$SLUGS" > .orly-work/edit-slugs.txt

      - name: Plan the edit with Opus 5.5
        run: >-
          node generator/run-opus.mjs --role planning
          --prompt-file .github/prompts/plan-edit.md
          --output .orly-work/plan-result.jsonl
          --provenance .orly-work/plan-provenance.json --max-turns 150
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Apply the edit with Opus 5.5
        id: edit
        continue-on-error: true
        run: >-
          node generator/run-opus.mjs --role animation2d
          --prompt-file .orly-work/author-assignment.md
          --output .orly-work/author-result.jsonl
          --provenance .orly-work/author-provenance.json --max-turns 250
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # gpt-image cover only (not authoring)
          NOUN_PROJECT_KEY: ${{ secrets.NOUN_PROJECT_KEY }}
          NOUN_PROJECT_SECRET: ${{ secrets.NOUN_PROJECT_SECRET }}

      - name: Commit + push to the PR branch
        id: push
        if: always() # push whatever changed, even if the edit errored partway
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EDIT_OUTCOME: ${{ steps.edit.outcome }}
        run: |
          set -euo pipefail
          git add -A public/generated
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "🤷 That request didn't produce any changes (edit \`${EDIT_OUTCOME}\`) — see the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            [ "$EDIT_OUTCOME" = "success" ] && exit 0 || exit 1
          fi
          git commit -m "tweak via @claude (#${{ github.event.issue.number }})"
          # checkout's persisted token may be gone after the authoring step — push via an
          # explicitly-authenticated URL (GITHUB_TOKEN is masked in logs).
          BR=$(git rev-parse --abbrev-ref HEAD)
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BR"
          echo "br=$BR" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          if [ "$EDIT_OUTCOME" != "success" ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            gh issue comment "${{ github.event.issue.number }}" \
              --body "⚠️ Pushed partial changes — the edit didn't fully finish (\`$EDIT_OUTCOME\`). The preview will redeploy; reply \`@claude <change>\` to keep going."
          else
            gh issue comment "${{ github.event.issue.number }}" \
              --body "✅ Applied your change and pushed to this PR — the preview will redeploy shortly."
          fi

      - name: Deploy a preview for the PR
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run preview.yml --ref "${{ steps.push.outputs.br }}" -f pr="${{ github.event.issue.number }}"

      - name: Flag partial edit
        if: always() && steps.push.outputs.partial == 'true'
        run: exit 1
