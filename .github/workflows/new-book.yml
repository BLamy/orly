name: Book pipeline (issue → book)

# Open a "📕 New book", "📚 New book series", or "✏️ Tweak a book" issue (as the repo
# owner) and this runs Claude Code in CI to build or edit the book(s), then opens +
# auto-merges a PR. Merging re-triggers the Pages deploy (hence the PAT).

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    # Only the repo owner's issues, and only book/series issues, trigger generation.
    if: >
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'new-book') ||
       contains(github.event.issue.labels.*.name, 'new-series') ||
       contains(github.event.issue.labels.*.name, 'tweak-book'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # PAT so the eventual merge re-triggers deploy.yml
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Configure git identity
        run: |
          git config user.name "Brett Lamy"
          git config user.email "brett.lamy@replay.io"

      - name: Acknowledge the issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "🤖 On it — generating in CI. Track progress in the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Generate the book(s) with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Pro/Max subscription token (run `claude setup-token` locally).
          # Swap for `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` to use an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A book request — issue #${{ github.event.issue.number }}.
            Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}

            TITLE: ${{ github.event.issue.title }}
            BODY:
            ${{ github.event.issue.body }}

            If the labels include "tweak-book", follow .claude/commands/tweak-book.md and
            make ONLY the requested edit to the existing book (parse its slug from the
            dropdown selection, which ends with " — <slug>").
            Else if the labels include "new-series", follow .claude/commands/new-series.md.
            Else follow .claude/commands/new-book.md.

            BUILD ONLY: run the generator steps so the requested book(s) under
            public/generated/ and library.json reflect the request. For a new book/series
            that's digest/study → storyboard → `node generator/cli.mjs …`; for a tweak
            it's the minimal edit + the matching regen tool. Keep going until done.

            Do NOT run any git or gh commands and do NOT open a PR — the workflow
            commits, opens the PR, and auto-merges after you finish.
          claude_args: |
            --max-turns 250
            --model claude-opus-4-8
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOUN_PROJECT_KEY: ${{ secrets.NOUN_PROJECT_KEY }}
          NOUN_PROJECT_SECRET: ${{ secrets.NOUN_PROJECT_SECRET }}

      - name: Commit, open PR, auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          BRANCH="book/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          node generator/sync-issue-books.mjs || true # keep the tweak dropdown current
          git add -A public/generated .github/ISSUE_TEMPLATE/tweak-book.yml
          if git diff --cached --quiet; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "⚠️ No changes were produced — see the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            exit 1
          fi
          git commit -m "${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "${{ github.event.issue.title }}" \
            --body "Closes #${{ github.event.issue.number }}

          Auto-generated by Claude Code in CI. Merging redeploys the shelf."
          gh pr merge "$BRANCH" --squash --admin --delete-branch
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ Merged — the shelf is redeploying. It'll be live at https://blamy.github.io/orly/ shortly."
