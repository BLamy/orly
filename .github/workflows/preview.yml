name: PR preview (Cloudflare)

# Every push to a book PR builds the shelf and uploads a NON-production Cloudflare
# version with a stable per-branch preview alias, then posts/updates a sticky comment
# linking straight to the book(s) in the preview. The `synchronize` trigger means
# @claude edits (which push to the PR branch) redeploy the same preview automatically.
# Until the Cloudflare secrets are set, it posts a "preview pending" note instead.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Only the bot's book PRs get a preview.
    if: startsWith(github.head_ref, 'book/')
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials are configured
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note that previews aren't configured yet
        if: steps.gate.outputs.ready != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cf-preview
          message: |
            ### ⏳ Preview pending
            Add the `CLOUDFLARE_API_TOKEN` + `CLOUDFLARE_ACCOUNT_ID` repo secrets to enable
            per-PR previews. Once set, every push here deploys a live preview link.

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need main in history to diff for changed slugs

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - if: steps.gate.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: Derive a stable preview alias from the branch
        id: alias
        if: steps.gate.outputs.ready == 'true'
        run: |
          # CF preview aliases must be a DNS label: lowercase [a-z0-9-], <=28 chars.
          alias=$(printf '%s' "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload preview version to Cloudflare
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}

      - name: Resolve preview URL + changed book slugs
        id: meta
        if: steps.gate.outputs.ready == 'true'
        env:
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          set -euo pipefail
          # Pull the preview URL printed by wrangler (alias URL is stable across pushes).
          url=$(printf '%s' "$WRANGLER_OUTPUT" \
            | grep -oE 'https://[a-z0-9.-]*workers\.dev' | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          slugs=$(git diff origin/main...HEAD --name-only \
            | grep -E '^public/generated/[^/]+/' \
            | sed -E 's|public/generated/([^/]+)/.*|\1|' | sort -u || true)
          {
            echo "links<<EOF"
            if [ -n "$slugs" ] && [ -n "$url" ]; then
              while IFS= read -r s; do
                [ -z "$s" ] && continue
                echo "- [\`$s\`]($url/?bundle=$s)"
              done <<< "$slugs"
            else
              echo "- $url"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post / update the preview comment
        if: steps.gate.outputs.ready == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cf-preview
          message: |
            ### 📖 Preview deployed

            **Shelf:** ${{ steps.meta.outputs.url }}

            Books in this PR:
            ${{ steps.meta.outputs.links }}

            _Redeploys on every push. Reply with **@claude &lt;change&gt;** on this PR to revise a book._
