name: Test pipeline (cheap, no generation)

# Manually-run smoke test for the PR + preview plumbing WITHOUT paying for a full
# Claude/ElevenLabs/cover generation. It makes a trivial change under a book dir,
# pushes a `book/test-<run>` branch, and opens a PR (never merged) so preview.yml
# fires. Run from the Actions tab or: gh workflow run test-pipeline.yml -f slug=koa-onion

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Existing book slug to touch (drives the preview link)
        default: koa-onion
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch preview.yml for the test PR

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trivial change → push → open PR (no merge) → dispatch preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          BRANCH="book/test-${{ github.run_id }}"
          git config user.name "Brett Lamy"
          git config user.email "brett.lamy@replay.io"
          git checkout -b "$BRANCH"
          # A harmless marker under the book dir so preview.yml resolves the slug + link.
          mkdir -p "public/generated/$SLUG"
          printf 'pipeline smoke test — run %s\n' "${{ github.run_id }}" > "public/generated/$SLUG/.pipeline-test"
          git add -A "public/generated/$SLUG/.pipeline-test"
          git commit -m "test: pipeline smoke (no generation)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "test: pipeline smoke (no generation)" \
            --body "Cheap PR that exercises **commit → push → PR → preview** without running Claude/TTS/cover. Touches \`public/generated/$SLUG/.pipeline-test\`. Safe to close (delete the branch) when done.")
          gh workflow run preview.yml --ref "$BRANCH" -f pr="${PR_URL##*/}"
